[project]
name = "ops-hardener"
version = "0.1.0"
description = "A CLI tool to scan Dockerfiles and Kubernetes manifests for security vulnerabilities and best practices."
authors = [{name = "User"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0"
]

[project.scripts]
ops-hardener = "ops_hardener.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
